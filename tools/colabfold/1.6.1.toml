[tool]
id          = "colabfold"
version     = "1.6.1"
description = "Fast protein structure prediction using AlphaFold2 with MMseqs2-based MSA generation"
homepage    = "https://github.com/sokrypton/ColabFold"
license     = "MIT"
tier        = "core"
maintainers = ["github:sokrypton"]

[[tool.inputs]]
name        = "input_path"
type        = "fasta[protein]"
cardinality = "one"
required    = true
description = "Input FASTA, A3M, CSV/TSV, or directory of any of the above. For multimers, separate chains with ':'."

[[tool.outputs]]
name        = "output_dir"
type        = "dir"
cardinality = "one"
description = "Directory containing all output files: ranked PDB structures, per-model JSON scores (pLDDT, pTM, ipTM, PAE), A3M MSAs, and coverage plots."

[[tool.outputs]]
name        = "pdb_files"
type        = "pdb"
cardinality = "many"
description = "Ranked predicted structures named <query>_rank_<N>_<model>_seed_<S>.pdb. Relaxed variants included if use_amber=true."

[[tool.outputs]]
name        = "score_files"
type        = "file"
cardinality = "many"
description = "Per-model JSON score files containing per-residue pLDDT, pTM, ipTM, and PAE matrix. Paired 1:1 with pdb_files."

[[tool.outputs]]
name        = "msa_files"
type        = "msa[a3m]"
cardinality = "many"
description = "A3M multiple sequence alignments generated by MMseqs2."

[tool.image]
backend   = "docker"
reference = "ghcr.io/sokrypton/colabfold:1.6.1-cuda12"


[tool.hardware]
cpu_cores = 8
ram_gb = 16.0
disk_gb = 10.0

[tool.hardware.gpu]
required = true
min_vram_gb = 8
cuda_version = "12.0"

[tool.entrypoint]
command       = "colabfold_batch"
args_template = "{input_path} {output_dir}"

cache_paths = ["/cache/colabfold"]

[tool.binaries]
exposed = ["colabfold_batch"]

[tool.factored]
spec_path = "specs/colabfold/1.6.1.toml"
image_reference = "ghcr.io/tejasprabhune/bv-pkg/colabfold:1.6.1"
image_digest = "sha256:4b928c3b6eb9b35c76af6d735cc545aeb9d6f106e7bbb07233048b73c87552b6"
