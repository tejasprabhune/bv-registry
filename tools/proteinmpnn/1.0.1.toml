[tool]
id          = "proteinmpnn"
version     = "1.0.1"
description = "Deep-learning protein sequence design (inverse folding): given a fixed backbone, sample amino-acid sequences predicted to fold to it. Supports monomers, multi-chain complexes, homo-oligomers, fixed/tied positions, AA-composition and PSSM bias, CA-only and soluble-protein models, and sequence scoring"
homepage    = "https://github.com/dauparas/ProteinMPNN"
license     = "MIT"
tier        = "community"
maintainers = [ "github:dauparas",]

[[tool.inputs]]
name        = "pdb_path"
type        = "pdb"
required    = true
cardinality = "one"
description = "Single input backbone to redesign (--pdb_path). ProteinMPNN reads the backbone atoms (N, CA, C, O) and samples an amino-acid sequence for it. For batches or complex chain handling, pre-parse structures with parse_multiple_chains.py and use jsonl_path instead of this."

[[tool.inputs]]
name        = "jsonl_path"
type        = "file"
required    = false
cardinality = "one"
description = "Parsed-backbone JSONL (--jsonl_path) produced by helper_scripts/parse_multiple_chains.py - the multi-structure / multi-chain alternative to pdb_path. Append --jsonl_path {jsonl_path} and drop --pdb_path."

[[tool.inputs]]
name        = "chain_id_jsonl"
type        = "file"
required    = false
cardinality = "one"
description = "JSONL specifying which chains are designed versus fixed (--chain_id_jsonl), produced by helper_scripts/assign_fixed_chains.py. If omitted, all chains are designed."

[[tool.inputs]]
name        = "fixed_positions_jsonl"
type        = "file"
required    = false
cardinality = "one"
description = "JSONL of per-chain residue positions to hold fixed during design (--fixed_positions_jsonl), produced by helper_scripts/make_fixed_positions_dict.py."

[[tool.inputs]]
name        = "tied_positions_jsonl"
type        = "file"
required    = false
cardinality = "one"
description = "JSONL of tied residue positions (--tied_positions_jsonl), produced by helper_scripts/make_tied_positions_dict.py. Tied positions are forced to share the same amino acid - used for symmetric / homo-oligomer design."

[[tool.inputs]]
name        = "bias_AA_jsonl"
type        = "file"
required    = false
cardinality = "one"
description = "JSONL of global amino-acid composition bias (--bias_AA_jsonl), e.g. make alanine less likely and phenylalanine more likely, produced by helper_scripts/make_bias_AA.py."

[[tool.inputs]]
name        = "omit_AA_jsonl"
type        = "file"
required    = false
cardinality = "one"
description = "JSONL specifying which amino acids to forbid at specific chains and positions (--omit_AA_jsonl)."

[[tool.inputs]]
name        = "pssm_jsonl"
type        = "file"
required    = false
cardinality = "one"
description = "JSONL PSSM bias (--pssm_jsonl); steer design toward a sequence profile in combination with --pssm_multi, --pssm_threshold, --pssm_log_odds_flag and --pssm_bias_flag."

[[tool.inputs]]
name        = "path_to_fasta"
type        = "file"
required    = false
cardinality = "one"
description = "FASTA of sequence(s) to score against the backbone in scoring mode (--path_to_fasta); chains are separated by '/'. Use together with --score_only 1 to return the model's score for given sequences rather than sampling new ones."

[[tool.inputs]]
name        = "path_to_model_weights"
type        = "dir"
required    = false
cardinality = "one"
description = "Override directory of model weights (--path_to_model_weights). Defaults to the vanilla, soluble and CA-only weights bundled in the image; set this only for custom or newer checkpoints."

[[tool.outputs]]
name        = "output_dir"
type        = "dir"
required    = true
cardinality = "one"
description = "Output folder (--out_folder). Contains seqs/<name>.fa holding the original and all designed sequences (each FASTA header records score, global_score, seq_recovery, model_name and seed); scores/<name>.npz of per-residue scores when --save_score 1 is added; and probs/<name>.npz of per-position amino-acid probabilities when --save_probs 1 is added."

[tool.image]
backend   = "docker"
reference = "docker.io/rosettacommons/proteinmpnn:latest"

[tool.hardware]
cpu_cores = 4
ram_gb    = 8.0
disk_gb   = 15.0

[tool.hardware.gpu]
required     = false
min_vram_gb  = 4
cuda_version = "11.3"

[tool.entrypoint]
command       = "python"
args_template = "/app/proteinmpnn/protein_mpnn_run.py --pdb_path {pdb_path} --out_folder {output_dir}"

[tool.binaries]
exposed = [ "python", "protein_mpnn_run.py", "parse_multiple_chains.py", "assign_fixed_chains.py", "make_fixed_positions_dict.py", "make_tied_positions_dict.py", "make_bias_AA.py", "make_bias_per_residue_dict.py",]
